name: "flashpoint-stormmode"
version: "0.1.0"
description: "Tiered storm-mode controller (FlashPoint D2-3): IDLE->OUTLOOK->APPROACH->STORM->AFTERMATH state machine with guardrails (capture budgets, timeouts, hysteresis) and a full published audit trail. Feeds: NWS alerts, Xweather cells/strikes (budget-aware), node met. Fleet actions are dry-run intents. Default mode replays the real Kitten Fire ignition storm (145 min trigger lead) fully offline."
